[versions]
compileSdk = "35"
targetSdk = "35"
minSdk = "21"
xiaojinzi-android-support = "v1.0-beta225"
compose = "1.7.5"
lifecycle = "2.8.7"
lottie = "6.6.0"
kcomponent = "v1.0.8-rc5"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.26"
agp = "8.2.2"
# kotlinCompilerExtensionVersion = "1.5.15"
junit = "4.13.2"
androidx-test-ext-junit = "1.2.1"
