gradle-kotlin-dsl-plugin = { group = "org.gradle.kotlin", name = "gradle-kotlin-dsl-plugins", version = "4.5.0" }
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
